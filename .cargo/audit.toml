# cargo audit settings for app/src-tauri/Cargo.lock (CI: Rust dependency audit).
[advisories]
ignore = [
  # zip 4.x symlink and permission handling in ZipArchive::extract. The only user
  # is tauri-plugin-updater 2.x, which extracts an update archive only after its
  # minisign signature verifies against our public key, so a malicious archive
  # would need our signing key. zip 9 needs tauri-plugin-updater 3 (alpha only
  # as of 2026-10-27); drop these once the updater moves to zip 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
