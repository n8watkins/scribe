[package]
name = "app"
version = "0.16.3"
description = "Private local dictation for Windows."
authors = ["Nat Atkins"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
# Only the desktop binary links this library. The staticlib and cdylib types
# from the Tauri template are for mobile targets, which Scribe doesn't build.
crate-type = ["rlib"]

[features]
# Test only: the Windows end-to-end job (.github/workflows/e2e-windows.yml)
# records a WAV file in place of the microphone
# (crates/scribe-core/src/test_audio.rs). Shipped builds never turn it on.
e2e-audio = ["scribe-core/e2e-audio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The shell: the Tauri app, its plugins, windows and tray. Everything else is
# in the engine, crates/scribe-core.
[dependencies]
scribe-core = { path = "../../crates/scribe-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# The startup entry behind TauriHost's launch-at-login calls, and the plugin
# the shell registers (tauri_host::autostart_plugin).
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by the commands (src/commands): clip playback and the export file name.
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# tauri::test's mock app, to check the engine's folders against Tauri's
# resolver (src/tauri_host.rs).
tauri = { version = "2", features = ["tray-icon", "test"] }

[target.'cfg(windows)'.dependencies]
# The native folder, save and open dialogs of the data commands
# (src/commands/data.rs). Windows-only (the app ships for Windows); the
# picker commands error elsewhere. xdg-portal feature disabled so no
# GTK/portal system libs are pulled in.
rfd = { version = "0.15", default-features = false }
# Colors the native title bar (style_native_titlebar in src/lib.rs).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }
