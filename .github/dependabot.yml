version: 2
# The Tauri packages come in npm and Rust pairs (@tauri-apps/api and tauri,
# @tauri-apps/plugin-X and tauri-plugin-X), and the Tauri CLI refuses to bundle
# when a pair differs in major or minor version (#85). One group across both
# ecosystems moves each pair in the same pull request.
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: build
      include: scope
updates:
  # release-kit (the root dev dependency): each kit release, majors included.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    allow:
      - dependency-name: release-kit

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    patterns: ["@tauri-apps/api", "@tauri-apps/plugin-*"]
    multi-ecosystem-group: tauri
    groups:
      safe-updates:
        update-types: [minor, patch]
        exclude-patterns: ["@tauri-apps/api", "@tauri-apps/plugin-*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /integrations/mcp-server
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
    multi-ecosystem-group: tauri
    groups:
      safe-updates:
        update-types: [minor, patch]
        exclude-patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
