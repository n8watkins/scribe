name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor: stable or dev"
        type: choice
        options:
          - stable
          - dev
        default: stable

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.flavor || 'stable' }}
  cancel-in-progress: false

env:
  WHISPER_CPP_VERSION: v1.9.1
  WHISPER_CPP_COMMIT: f049fff95a089aa9969deb009cdd4892b3e74916

jobs:
  build-windows:
    name: Build release candidate
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      flavor: ${{ steps.metadata.outputs.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release metadata
        id: metadata
        shell: pwsh
        env:
          SCRIBE_GITHUB_APP_CLIENT_ID: ${{ vars.SCRIBE_GITHUB_APP_CLIENT_ID }}
        run: |
          $packageVersion = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $packageVersion -or $packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$packageVersion") {
            throw "Tag ${{ github.ref_name }} does not match configured version v$packageVersion"
          }
          if ($env:SCRIBE_GITHUB_APP_CLIENT_ID -notmatch '^Iv[0-9A-Za-z]+$') {
            throw "Repository variable SCRIBE_GITHUB_APP_CLIENT_ID must contain the GitHub App client ID (Iv...)."
          }
          $flavor = "${{ inputs.flavor || 'stable' }}"
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "flavor=$flavor" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $stage = Join-Path $env:RUNNER_TEMP "scribe-release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Set-Content -Path (Join-Path $stage "version.txt") -Value $packageVersion -NoNewline
          Set-Content -Path (Join-Path $stage "flavor.txt") -Value $flavor -NoNewline

      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: app
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/scribe-release/scribe-${{ steps.metadata.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Add bundled whisper.cpp to SBOM
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP\scribe-release\scribe-${{ steps.metadata.outputs.version }}.cdx.json"
          $sbom = Get-Content $path -Raw | ConvertFrom-Json
          $whisper = [ordered]@{
            type = "library"
            name = "whisper.cpp"
            version = $env:WHISPER_CPP_VERSION.TrimStart("v")
            purl = "pkg:github/ggml-org/whisper.cpp@$($env:WHISPER_CPP_VERSION.TrimStart('v'))"
            externalReferences = @(
              [ordered]@{
                type = "vcs"
                url = "https://github.com/ggml-org/whisper.cpp/tree/$env:WHISPER_CPP_COMMIT"
              }
            )
          }
          $sbom.components = @($sbom.components) + $whisper
          $sbom | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8
          Get-Content $path -Raw | ConvertFrom-Json | Out-Null

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # release-kit's check (the root dev dependency) covers every file that
      # carries the version (.release.json), including the root package.json
      # and both lock files.
      - name: Tag matches every version file
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --allow-git=root
          npx --no-install release-kit release --verify-tag "$TAG"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.350.0
          install_runtime: true
          cache: true

      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installationPath) { throw "Visual Studio with the x64 C++ toolchain was not found" }
          $devCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCommand)) { throw "VsDevCmd.bat was not found at $devCommand" }
          & cmd.exe /s /c "`"$devCommand`" -no_logo -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }

      # Install scripts stay off so no dependency runs code at install time;
      # esbuild's is the only one the Windows build needs, so it runs on its own.
      - name: Install and validate application dependencies
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
          npm audit
          npm run lint
          npm test
          npm run build

      - name: Validate Rust backend
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build reviewed whisper.cpp source with Vulkan
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\wcpp"
          git clone --depth 1 --branch "$env:WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp $src
          $actual = (git -C $src rev-parse HEAD).Trim()
          if ($actual -ne $env:WHISPER_CPP_COMMIT) {
            throw "whisper.cpp commit $actual did not match reviewed commit $env:WHISPER_CPP_COMMIT"
          }
          Push-Location $src
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=ON `
            -DWHISPER_BUILD_EXAMPLES=ON `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=ON
          cmake --build build -j
          Pop-Location
          $cli = Get-ChildItem -Path "$src\build" -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { throw "whisper-cli.exe not found after the Vulkan build" }
          $bin = Split-Path $cli.FullName
          $dest = "app/src-tauri/resources/bin/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $needed = @("whisper-cli.exe", "whisper-server.exe", "whisper.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu.dll", "ggml-vulkan.dll")
          foreach ($name in $needed) {
            $file = Get-ChildItem -Path $bin -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { throw "Missing $name in the Vulkan build output" }
            Copy-Item $file.FullName -Destination $dest
          }

      # The build never sees the updater signing key: it skips the updater
      # artifacts, and the next step signs the installer on its own, so no
      # build script, proc macro or npm package can read the key.
      - name: Build installers
        working-directory: app
        shell: pwsh
        env:
          SCRIBE_GITHUB_APP_CLIENT_ID: ${{ vars.SCRIBE_GITHUB_APP_CLIENT_ID }}
        run: |
          $configs = @("--config", "src-tauri/tauri.unsigned-build.conf.json")
          if ("${{ steps.metadata.outputs.flavor }}" -eq "dev") {
            $configs += @("--config", "src-tauri/tauri.dev-flavor.conf.json")
          }
          npm run tauri -- build @configs

      # Only tagged releases are signed, so manual and dev builds never
      # touch the key. The signature is what latest.json carries and what
      # installed copies verify against the pubkey in tauri.conf.json.
      - name: Sign updater artifact
        if: github.ref_type == 'tag'
        working-directory: app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe")
          if ($setup.Count -ne 1) { throw "Expected one NSIS installer to sign, found $($setup.Count)" }
          npx --no-install tauri signer sign $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing the updater artifact failed" }
          if (-not (Test-Path "$($setup[0].FullName).sig")) { throw "The signer did not write $($setup[0].Name).sig" }

      - name: Stage and validate release candidate
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\scribe-release"
          $nsisDir = "app/src-tauri/target/release/bundle/nsis"
          $msiDir = "app/src-tauri/target/release/bundle/msi"
          $setup = @(Get-ChildItem -Path $nsisDir -Filter "*-setup.exe")
          $msi = @(Get-ChildItem -Path $msiDir -Filter "*.msi")
          if ($setup.Count -ne 1) { throw "Expected one NSIS installer, found $($setup.Count)" }
          if ($msi.Count -ne 1) { throw "Expected one MSI installer, found $($msi.Count)" }
          Copy-Item $setup[0].FullName, $msi[0].FullName -Destination $stage

          if ("${{ github.ref_type }}" -eq "tag") {
            $signature = "$($setup[0].FullName).sig"
            if (-not (Test-Path $signature)) { throw "Missing Tauri updater signature for $($setup[0].Name)" }
            Copy-Item $signature -Destination $stage
            $tag = "${{ github.ref_name }}"
            $manifest = [ordered]@{
              version = "${{ steps.metadata.outputs.version }}"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = (Get-Content $signature -Raw).Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($setup[0].Name)"
                }
              }
            }
            $manifestPath = Join-Path $stage "latest.json"
            $manifest | ConvertTo-Json -Depth 4 | Set-Content $manifestPath -Encoding utf8
            $parsed = Get-Content $manifestPath -Raw | ConvertFrom-Json
            if ($parsed.version -ne "${{ steps.metadata.outputs.version }}") { throw "Updater version mismatch" }
            if (@($parsed.platforms.PSObject.Properties).Count -ne 1) { throw "Unexpected updater platforms" }
            if ($parsed.platforms.'windows-x86_64'.signature -ne (Get-Content $signature -Raw).Trim()) { throw "Updater signature mismatch" }
            if (-not $parsed.platforms.'windows-x86_64'.url.EndsWith("/$($setup[0].Name)")) { throw "Updater installer URL mismatch" }
          }

          $files = Get-ChildItem $stage -File | Where-Object Name -NotIn @("SHA256SUMS.txt", "version.txt", "flavor.txt") | Sort-Object Name
          $lines = foreach ($file in $files) {
            "{0}  {1}" -f (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name
          }
          Set-Content -Path (Join-Path $stage "SHA256SUMS.txt") -Value $lines -Encoding ascii

      - name: Upload release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scribe-release-candidate
          path: ${{ runner.temp }}/scribe-release/*
          if-no-files-found: error
          retention-days: 14

  smoke-install:
    name: Smoke install (${{ matrix.kind }})
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi]
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scribe-release-candidate
          path: candidate

      # Only the short speech clip the self-test transcribes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: app/src-tauri/tests/fixtures
          persist-credentials: false

      # A hung msiexec, installer or app must fail the job (so the logs
      # upload) instead of holding the runner for hours.
      - name: Verify checksums, install candidate and transcribe a clip
        timeout-minutes: 25
        shell: pwsh
        run: |
          $candidate = (Resolve-Path candidate).Path
          foreach ($line in Get-Content "$candidate\SHA256SUMS.txt") {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $actual = (Get-FileHash (Join-Path $candidate $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch for $($Matches[2])" }
          }

          if ("${{ matrix.kind }}" -eq "nsis") {
            $installer = @(Get-ChildItem $candidate -Filter "*-setup.exe")
            if ($installer.Count -ne 1) { throw "Expected one NSIS installer" }
            $process = Start-Process $installer[0].FullName -ArgumentList "/S" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS install failed with $($process.ExitCode)" }
          } else {
            $installer = @(Get-ChildItem $candidate -Filter "*.msi")
            if ($installer.Count -ne 1) { throw "Expected one MSI installer" }
            # Start-Process joins ArgumentList with spaces and never quotes, so
            # quote the paths: "Scribe Dev_..." otherwise reaches msiexec as
            # two arguments and it waits forever on its modal usage dialog.
            $process = Start-Process msiexec.exe -ArgumentList @("/i", "`"$($installer[0].FullName)`"", "/qn", "/norestart", "/L*V", "`"$env:RUNNER_TEMP\scribe-msi-install.log`"") -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSI install failed with $($process.ExitCode)" }
          }

          $roots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $roots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -in @("Scribe", "Scribe Dev") } |
            Select-Object -First 1
          if (-not $entry) { throw "Scribe uninstall entry was not created" }
          if ($entry.DisplayVersion -ne "${{ needs.build-windows.outputs.version }}") {
            throw "Installed version $($entry.DisplayVersion) did not match ${{ needs.build-windows.outputs.version }}"
          }

          $binaryName = if ($entry.DisplayName -eq "Scribe Dev") { "Scribe Dev.exe" } else { "Scribe.exe" }
          $displayIcon = (([string]$entry.DisplayIcon).Trim('"') -replace ',\d+$', '').Trim()
          $installLocation = ([string]$entry.InstallLocation).Trim().Trim('"')
          $candidatePaths = @(
            $displayIcon
            if ($installLocation) { Join-Path $installLocation $binaryName }
          ) | Where-Object { $_ }
          $exePath = $candidatePaths |
            Where-Object { (Split-Path $_ -Leaf) -eq $binaryName -and (Test-Path $_ -PathType Leaf) } |
            Select-Object -First 1
          $exe = if ($exePath) { Get-Item $exePath }
          if (-not $exe) { throw "Installed Scribe executable was not found" }
          $installDir = $exe.Directory.FullName
          foreach ($name in @("whisper-cli.exe", "whisper-server.exe", "whisper.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu.dll", "ggml-vulkan.dll")) {
            if (-not (Get-ChildItem $installDir -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Installed bundle is missing $name"
            }
          }

          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Scribe exited during launch smoke test with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          # The single-instance guard would hand the next launch to this copy.
          if (-not $app.WaitForExit(30000)) { throw "Scribe did not stop after the launch smoke test" }

          # End to end through the installed app: it starts as usual on this
          # fresh runner profile, downloads the default model through its
          # verified download path, transcribes the clip with the bundled
          # whisper.cpp, writes the result and exits. Paths are quoted
          # because Start-Process joins ArgumentList without quoting.
          $clip = (Resolve-Path "source/app/src-tauri/tests/fixtures/jfk.wav").Path
          $resultPath = Join-Path $env:RUNNER_TEMP "scribe-self-test.json"
          $selfTest = Start-Process $exe.FullName -ArgumentList @("--self-test-transcribe", "`"$clip`"", "`"$resultPath`"") -PassThru
          $null = $selfTest.Handle # keeps ExitCode readable after exit
          if (-not $selfTest.WaitForExit(600000)) {
            Stop-Process -Id $selfTest.Id -Force -ErrorAction SilentlyContinue
            throw "The self-test did not finish within 10 minutes"
          }
          if (-not (Test-Path $resultPath)) { throw "The self-test exited with $($selfTest.ExitCode) and wrote no result" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          Write-Host "Self-test: model $($result.modelId), $($result.latencyMs) ms, text: $($result.text)"
          if (-not $result.ok) { throw "The self-test failed: $($result.error)" }
          if ($selfTest.ExitCode -ne 0) { throw "The self-test reported success but exited with $($selfTest.ExitCode)" }
          if ([string]::IsNullOrWhiteSpace($result.text)) { throw "The self-test transcript was empty" }
          if ($result.text -notmatch "country") { throw "The self-test transcript did not match the clip: $($result.text)" }
          if ($result.appVersion -ne "${{ needs.build-windows.outputs.version }}") {
            throw "The self-test ran version $($result.appVersion), not ${{ needs.build-windows.outputs.version }}"
          }

          if ("${{ matrix.kind }}" -eq "msi") {
            $uninstall = Start-Process msiexec.exe -ArgumentList @("/x", $entry.PSChildName, "/qn", "/norestart", "/L*V", "`"$env:RUNNER_TEMP\scribe-msi-uninstall.log`"") -Wait -PassThru
          } else {
            # Run the uninstaller directly: UninstallString is a quoted path,
            # and passing it through cmd.exe breaks on spaces in that path.
            $uninstaller = ([string]$entry.UninstallString).Trim().Trim('"')
            if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "NSIS uninstaller was not found at $uninstaller" }
            $uninstall = Start-Process $uninstaller -ArgumentList "/S" -Wait -PassThru
          }
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "Uninstall failed with $($uninstall.ExitCode)" }
          if (Test-Path $exe.FullName) { throw "Scribe executable remained after uninstall" }

      - name: Collect app logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($id in @("com.natkins.scribe", "com.natkins.scribe.dev")) {
            $logs = Join-Path $env:LOCALAPPDATA "$id\logs"
            if (Test-Path $logs) {
              Get-ChildItem $logs -Filter *.log | ForEach-Object {
                Copy-Item $_.FullName (Join-Path $env:RUNNER_TEMP "scribe-app-$id-$($_.Name)")
              }
            }
          }

      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: smoke-logs-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/scribe-*.log
            ${{ runner.temp }}/scribe-self-test.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish verified release
    needs: [build-windows, smoke-install]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes need the previous tag
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # User-facing notes from the Conventional Commits since the previous
      # release (release-kit), the same section the release commit wrote to
      # CHANGELOG.md; not GitHub's list of pull request titles.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --allow-git=root
          npx --no-install release-kit notes --to "$TAG" > release-notes.md
          test -s release-notes.md

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scribe-release-candidate
          path: candidate

      - name: Attach verified candidate to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          assets=(
            candidate/*-setup.exe
            candidate/*-setup.exe.sig
            candidate/*.msi
            candidate/latest.json
            candidate/*.cdx.json
            candidate/SHA256SUMS.txt
          )
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$repo"
          else
            gh release create "$tag" "${assets[@]}" --notes-file release-notes.md --verify-tag --repo "$repo"
          fi

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloaded
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir downloaded
          cp candidate/SHA256SUMS.txt downloaded/
          cd downloaded
          sha256sum --check SHA256SUMS.txt
