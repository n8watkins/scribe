name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-backend:
    name: Desktop backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: ". -> target"

      # The whole Cargo workspace: the shell (app/src-tauri) and the engine
      # (crates/scribe-core).
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run backend tests
        run: cargo test --locked --workspace

      # The test-only audio input of the end-to-end build (e2e-windows.yml).
      # One command per step: a pwsh step fails only on its last command's
      # exit code.
      - name: Lint the e2e-audio feature
        run: cargo clippy --locked --workspace --all-targets --features e2e-audio -- -D warnings

      - name: Test the e2e-audio feature
        run: cargo test --locked --workspace --features e2e-audio test_audio

  desktop-frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Same install as the release build: scripts off, esbuild's run on its own.
      - name: Install dependencies
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      # Shipped dependencies must be clean; dev-only tooling (the eslint chain)
      # fails only on high or critical, since its moderate advisories often wait
      # weeks for an upstream release.
      - name: Audit dependencies
        working-directory: app
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Lint frontend
        working-directory: app
        run: npm run lint

      - name: Test frontend
        working-directory: app
        run: npm test

      - name: Build frontend
        working-directory: app
        run: npm run build

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: cli

      - name: Check formatting
        working-directory: cli
        run: cargo fmt --check

      - name: Run clippy
        working-directory: cli
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: cli
        run: cargo test --locked

  mcp-server:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: integrations/mcp-server
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      # Shipped dependencies must be clean; dev-only tooling (the eslint chain)
      # fails only on high or critical, since its moderate advisories often wait
      # weeks for an upstream release.
      - name: Audit dependencies
        working-directory: integrations/mcp-server
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Test, typecheck, and build
        working-directory: integrations/mcp-server
        run: npm test && npm run typecheck && npm run build

  # The release workflow's SBOM steps (release.yml, build-windows), run the
  # same way here so a change that empties the SBOM fails on its pull request.
  release-sbom:
    name: Release SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage the SBOM source
        shell: pwsh
        run: ./.github/scripts/sbom-source.ps1 -Out "$env:RUNNER_TEMP/scribe"

      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/scribe
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/scribe.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Check the SBOM lists the Rust crates and npm packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/check-sbom.ps1 -Sbom "$env:RUNNER_TEMP/scribe.cdx.json" -Repository "${{ github.repository }}"

  rust-security:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file cli/Cargo.lock
