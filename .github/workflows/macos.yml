name: macOS (beta)

# The macOS build: a universal (Apple Silicon and Intel) .dmg, installed and
# launched on a fresh runner before anything uses it. On pull requests it stays
# a workflow artifact; release.yml calls this workflow (release: true) and
# attaches the tested .dmg to the GitHub Release. Windows and Linux bundles are
# unchanged because the macOS targets live in tauri.macos.conf.json, which
# Tauri merges only when it builds on macOS.
#
# There is no Apple Developer ID: the app and its bundled whisper.cpp binaries
# are ad-hoc signed (`codesign -s -`), which Apple Silicon needs to run any
# code at all. Gatekeeper still blocks the app on first open after a download,
# because it is not notarized; README.md says how users open it anyway.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Called from the release workflow: build and smoke-test only"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/macos.yml"
      - ".github/scripts/smoke-macos.sh"
      - "app/**"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same reviewed whisper.cpp source as the Windows release build.
  WHISPER_CPP_VERSION: v1.9.1
  WHISPER_CPP_COMMIT: f049fff95a089aa9969deb009cdd4892b3e74916
  # Bump when the whisper.cpp build flags below change, so the cache rebuilds.
  WHISPER_MACOS_BUILD: metal-arm64-cpu-x86_64-1
  # The oldest macOS the build supports: ggml's Accelerate path calls the
  # new LAPACK interface (cblas_sgemm), which macOS has only since 13.3, the
  # same floor upstream whisper.cpp and llama.cpp use. Keep it in step with
  # minimumSystemVersion in tauri.macos.conf.json.
  MACOSX_DEPLOYMENT_TARGET: "13.3"

jobs:
  # The macOS-only Rust code (platform/macos.rs and everything cfg'd for it)
  # is otherwise never compiled, linted or tested for aarch64-apple-darwin.
  backend-macos:
    name: Desktop backend (macOS)
    if: ${{ !inputs.release }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: app/src-tauri
          key: backend

      - name: Run clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run backend tests
        working-directory: app/src-tauri
        run: cargo test --locked

      # The platform tests that need the logged-in session's window server,
      # pasteboard and Accessibility permission, which the runner has: the
      # app in front, a clipboard snapshot and restore round trip, and real
      # paste, typing and selection copy in TextEdit.
      - name: Run macOS system tests
        working-directory: app/src-tauri
        run: cargo test --locked --lib platform::macos -- --ignored --test-threads=1 --nocapture

  build-macos:
    name: Build macOS bundle
    # Apple Silicon runner; the Intel slice is cross-compiled and tested under
    # Rosetta.
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          xcrun --show-sdk-version
          system_profiler SPDisplaysDataType | sed -n '1,20p' || true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: app/src-tauri

      - name: Restore whisper.cpp build
        id: whisper-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/whisper-macos
          key: whisper-macos-${{ env.WHISPER_CPP_COMMIT }}-${{ env.WHISPER_MACOS_BUILD }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}

      # Statically linked, so the two binaries need no whisper or ggml dylibs
      # next to them, only system frameworks (Metal, Accelerate, Foundation).
      # The Metal shaders are compiled into the binary (GGML_METAL_EMBED_LIBRARY)
      # so there is no default.metallib to find at run time. Each architecture
      # is built on its own and the two are joined with lipo. The Intel slice
      # is CPU only (Accelerate plus AVX2/FMA/F16C, which every Intel Mac that
      # runs macOS 13 has), as in upstream's own x86_64 macOS builds: under
      # Rosetta its Metal path returned empty transcripts, and Metal on Intel
      # Mac GPUs cannot be verified without one.
      - name: Build reviewed whisper.cpp source with Metal
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/wcpp"
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp "$src"
          actual="$(git -C "$src" rev-parse HEAD)"
          if [ "$actual" != "$WHISPER_CPP_COMMIT" ]; then
            echo "whisper.cpp commit $actual did not match reviewed commit $WHISPER_CPP_COMMIT" >&2
            exit 1
          fi
          for arch in arm64 x86_64; do
            metal=ON
            extra=()
            if [ "$arch" = x86_64 ]; then
              metal=OFF
              extra=(-DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON)
            fi
            cmake -S "$src" -B "$src/build-$arch" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$arch" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
              -DGGML_METAL="$metal" \
              -DGGML_METAL_EMBED_LIBRARY=ON \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DWHISPER_BUILD_EXAMPLES=ON \
              -DWHISPER_BUILD_TESTS=OFF \
              -DWHISPER_BUILD_SERVER=ON \
              ${extra[@]+"${extra[@]}"}
            cmake --build "$src/build-$arch" -j "$(sysctl -n hw.ncpu)" --target whisper-cli whisper-server
          done
          out="$RUNNER_TEMP/whisper-macos"
          mkdir -p "$out"
          for name in whisper-cli whisper-server; do
            lipo -create "$src/build-arm64/bin/$name" "$src/build-x86_64/bin/$name" -output "$out/$name"
          done

      # Saved straight away, so a later failure in the job does not throw the
      # whisper.cpp build away.
      - name: Save whisper.cpp build
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/whisper-macos
          key: ${{ steps.whisper-cache.outputs.cache-primary-key }}

      - name: Stage, sign and check whisper.cpp binaries
        run: |
          set -euo pipefail
          want="$(jq -r .bundle.macOS.minimumSystemVersion app/src-tauri/tauri.macos.conf.json)"
          if [ "$want" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "tauri.macos.conf.json wants macOS $want but whisper.cpp targets $MACOSX_DEPLOYMENT_TARGET" >&2
            exit 1
          fi
          dest=app/src-tauri/resources/bin/macos
          mkdir -p "$dest"
          for name in whisper-cli whisper-server; do
            install -m 0755 "$RUNNER_TEMP/whisper-macos/$name" "$dest/$name"
            archs="$(lipo -archs "$dest/$name")"
            echo "$name: $archs"
            for arch in arm64 x86_64; do
              if ! grep -qw "$arch" <<< "$archs"; then
                echo "$name is missing the $arch slice" >&2
                exit 1
              fi
            done
            # Nothing but system libraries and frameworks may be left to
            # resolve at run time.
            # otool prints one "(architecture ...)" header per slice; the
            # library lines below each header are indented.
            if otool -L "$dest/$name" | grep -E '^[[:space:]]' | grep -vE '^[[:space:]]+/(usr/lib|System/Library)/'; then
              echo "$name links a library the bundle does not ship" >&2
              exit 1
            fi
            for arch in arm64 x86_64; do
              minos="$(vtool -arch "$arch" -show-build "$dest/$name" | awk '$1 == "minos" { print $2 }')"
              if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
                echo "$name ($arch) needs macOS $minos, not $MACOSX_DEPLOYMENT_TARGET" >&2
                exit 1
              fi
            done
            codesign --force --sign - --timestamp=none "$dest/$name"
            codesign --verify --strict --verbose=2 "$dest/$name"
          done
          "$dest/whisper-cli" --help > /dev/null
          arch -x86_64 "$dest/whisper-cli" --help > /dev/null

      # Same install as the Windows build: scripts off, esbuild's run on its own.
      - name: Install application dependencies
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      # No updater artifacts and no signing key: tauri.macos.conf.json turns
      # updater artifacts off and sets the ad-hoc signing identity, and this
      # job never sees the updater key.
      - name: Build .app and .dmg
        working-directory: app
        env:
          SCRIBE_GITHUB_APP_CLIENT_ID: ${{ vars.SCRIBE_GITHUB_APP_CLIENT_ID }}
        run: npm run tauri -- build --target universal-apple-darwin

      - name: Verify bundle and signature
        id: bundle
        run: |
          set -euo pipefail
          bundle=app/src-tauri/target/universal-apple-darwin/release/bundle
          apps=("$bundle"/macos/*.app)
          dmgs=("$bundle"/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ ! -d "${apps[0]}" ]; then
            echo "Expected one .app" >&2
            exit 1
          fi
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "Expected one .dmg" >&2
            exit 1
          fi
          app="${apps[0]}"
          main="$app/Contents/MacOS/Scribe"
          echo "Scribe: $(lipo -archs "$main")"
          for name in whisper-cli whisper-server; do
            if [ ! -x "$app/Contents/Resources/bin/macos/$name" ]; then
              echo "The app is missing Resources/bin/macos/$name" >&2
              exit 1
            fi
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/bin/macos/$name"
          done
          # The keys from app/src-tauri/Info.plist must reach the bundle:
          # without NSMicrophoneUsageDescription macOS ends the app the first
          # time it opens the microphone.
          plist="$app/Contents/Info.plist"
          plutil -lint "$plist"
          mic="$(plutil -extract NSMicrophoneUsageDescription raw -o - "$plist")"
          echo "NSMicrophoneUsageDescription: $mic"
          minimum="$(plutil -extract LSMinimumSystemVersion raw -o - "$plist")"
          if [ "$minimum" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "LSMinimumSystemVersion is $minimum, not $MACOSX_DEPLOYMENT_TARGET" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1
          # Expected to reject: the app is ad-hoc signed and not notarized.
          # Recorded, not enforced.
          echo "spctl --assess (app):"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 || true
          echo "spctl --assess (dmg):"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmgs[0]}" 2>&1 || true
          echo "dmg=${dmgs[0]}" >> "$GITHUB_OUTPUT"

      # The end-to-end test input (the e2e-audio feature) must never ship.
      - name: Check the build has no test input
        run: |
          set -euo pipefail
          main="$(find app/src-tauri/target/universal-apple-darwin/release/bundle/macos -path '*/Contents/MacOS/Scribe')"
          if grep -q SCRIBE_E2E_AUDIO_WAV "$main"; then
            echo "$main contains the end-to-end test input" >&2
            exit 1
          fi

      # The versioned file Tauri names, plus a copy under a name that never
      # changes, so a site can link releases/latest/download/<name>.
      - name: Stage .dmg
        env:
          DMG: ${{ steps.bundle.outputs.dmg }}
        run: |
          stage="$RUNNER_TEMP/scribe-macos"
          mkdir -p "$stage"
          cp "$DMG" "$stage/"
          cp "$DMG" "$stage/Scribe-macos-universal.dmg"
          (cd "$stage" && shasum -a 256 -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload macOS bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scribe-macos
          path: ${{ runner.temp }}/scribe-macos/*
          if-no-files-found: error
          retention-days: 14

  smoke-macos:
    name: Install and launch on macOS
    needs: build-macos
    # A fresh runner that never built anything.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scribe-macos
          path: candidate

      - name: Install from the .dmg, launch and transcribe a clip
        timeout-minutes: 30
        run: |
          version="$(jq -r .version app/src-tauri/tauri.conf.json)"
          bash .github/scripts/smoke-macos.sh candidate app/src-tauri/tests/fixtures/jfk.wav "$version"

      - name: Collect app logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/scribe-logs"
          cp "$RUNNER_TEMP"/scribe-smoke/*.json "$RUNNER_TEMP"/scribe-smoke/*.log "$RUNNER_TEMP/scribe-logs/" 2>/dev/null || true
          for dir in "$HOME/Library/Logs/com.natkins.scribe" "$HOME/Library/Application Support/com.natkins.scribe/logs"; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "$RUNNER_TEMP/scribe-logs/" || true
            fi
          done
          # Crash reports, if the app or whisper.cpp crashed.
          find "$HOME/Library/Logs/DiagnosticReports" -newer app/package.json \( -name 'Scribe*' -o -name 'whisper*' \) \
            -exec cp {} "$RUNNER_TEMP/scribe-logs/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/scribe-logs"

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scribe-macos-logs
          path: ${{ runner.temp }}/scribe-logs
          if-no-files-found: ignore
          retention-days: 14
