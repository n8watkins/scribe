name: Linux (beta)

# The Linux build: an AppImage and a .deb, installed and launched on a fresh
# runner before anything uses them. On pull requests they stay workflow
# artifacts; release.yml calls this workflow (release: true) and attaches the
# tested files to the GitHub Release. Windows bundles are unchanged because
# the Linux targets live in tauri.linux.conf.json, which Tauri merges only
# when it builds on Linux.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Called from the release workflow: build and smoke-test only"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/linux.yml"
      - ".github/scripts/smoke-linux.sh"
      - "app/**"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same reviewed whisper.cpp source as the Windows release build.
  WHISPER_CPP_VERSION: v1.9.1
  WHISPER_CPP_COMMIT: f049fff95a089aa9969deb009cdd4892b3e74916

jobs:
  # The Linux-only Rust code (platform/linux.rs and everything cfg'd for it)
  # is otherwise never compiled, linted or tested in CI.
  backend-linux:
    name: Desktop backend (Linux)
    if: ${{ !inputs.release }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libdbus-1-dev \
            libssl-dev \
            gnome-keyring

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: app/src-tauri
          key: backend

      - name: Run clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run backend tests
        working-directory: app/src-tauri
        run: cargo test --locked

      # The GitHub token lives in the Secret Service on Linux. A private
      # session bus with an unlocked GNOME Keyring lets the ignored round-trip
      # test prove a credential is really stored, read back and deleted.
      - name: Run the Secret Service round trip
        working-directory: app/src-tauri
        run: |
          dbus-run-session -- sh -c '
            printf ci | gnome-keyring-daemon --unlock --components=secrets --daemonize > /dev/null
            cargo test --locked --lib secret_service_round_trips_a_credential -- --ignored
          '

  build-linux:
    name: Build Linux bundles
    # The oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf \
            file \
            cmake \
            ninja-build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: app/src-tauri

      # CPU only and statically linked, so the two binaries need no shared
      # whisper or ggml libraries next to them and no OpenMP runtime. The
      # Windows build adds Vulkan; Linux GPU support is not built yet.
      - name: Build reviewed whisper.cpp source
        run: |
          src="$RUNNER_TEMP/wcpp"
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp "$src"
          actual="$(git -C "$src" rev-parse HEAD)"
          if [ "$actual" != "$WHISPER_CPP_COMMIT" ]; then
            echo "whisper.cpp commit $actual did not match reviewed commit $WHISPER_CPP_COMMIT" >&2
            exit 1
          fi
          cmake -S "$src" -B "$src/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=ON
          cmake --build "$src/build" -j --target whisper-cli whisper-server
          dest=app/src-tauri/resources/bin/linux
          mkdir -p "$dest"
          for name in whisper-cli whisper-server; do
            install -m 0755 "$src/build/bin/$name" "$dest/$name"
          done
          # Nothing but system libraries may be left to resolve at run time.
          for name in whisper-cli whisper-server; do
            if ldd "$dest/$name" | grep -E 'libwhisper|libggml|not found'; then
              echo "$name links a library the bundle does not ship" >&2
              exit 1
            fi
          done
          "$dest/whisper-cli" --help > /dev/null

      # Same install as the Windows build: scripts off, esbuild's run on its own.
      - name: Install application dependencies
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      # No updater artifacts and no signing key: tauri.linux.conf.json turns
      # updater artifacts off, and this job never sees the key.
      - name: Build AppImage and .deb
        working-directory: app
        env:
          SCRIBE_GITHUB_APP_CLIENT_ID: ${{ vars.SCRIBE_GITHUB_APP_CLIENT_ID }}
        run: npm run tauri -- build

      - name: Verify and stage bundles
        run: |
          set -euo pipefail
          bundle=app/src-tauri/target/release/bundle
          appimage=("$bundle"/appimage/*.AppImage)
          deb=("$bundle"/deb/*.deb)
          if [ "${#appimage[@]}" -ne 1 ] || [ ! -f "${appimage[0]}" ]; then
            echo "Expected one AppImage" >&2
            exit 1
          fi
          if [ "${#deb[@]}" -ne 1 ] || [ ! -f "${deb[0]}" ]; then
            echo "Expected one .deb" >&2
            exit 1
          fi
          contents="$(dpkg-deb --contents "${deb[0]}")"
          for name in whisper-cli whisper-server; do
            if ! grep -q "bin/linux/$name\$" <<< "$contents"; then
              echo "The .deb is missing bin/linux/$name" >&2
              exit 1
            fi
          done
          # The end-to-end test input (the e2e-audio feature) must never ship.
          mapfile -t exes < <(find app/src-tauri/target/release -maxdepth 1 -type f -perm -u+x)
          if [ "${#exes[@]}" -eq 0 ]; then
            echo "No executable was built" >&2
            exit 1
          fi
          for exe in "${exes[@]}"; do
            if grep -q SCRIBE_E2E_AUDIO_WAV "$exe"; then
              echo "$exe contains the end-to-end test input" >&2
              exit 1
            fi
          done
          dpkg-deb --info "${deb[0]}"
          # The versioned files Tauri names, plus copies under names that never
          # change, so a site can link releases/latest/download/<name>.
          stage="$RUNNER_TEMP/scribe-linux"
          mkdir -p "$stage"
          cp "${appimage[0]}" "${deb[0]}" "$stage/"
          cp "${appimage[0]}" "$stage/Scribe-linux-x86_64.AppImage"
          cp "${deb[0]}" "$stage/Scribe-linux-amd64.deb"
          (cd "$stage" && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload Linux bundles
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scribe-linux
          path: ${{ runner.temp }}/scribe-linux/*
          if-no-files-found: error
          retention-days: 14

  smoke-linux:
    name: Install and launch on Linux
    needs: build-linux
    # A newer, clean runner without the build's -dev packages, so a missing
    # runtime dependency shows up here as it would for a user.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scribe-linux
          path: candidate

      # xvfb and a session bus stand in for the desktop; libfuse2 is what
      # the install docs ask AppImage users to add on Ubuntu 24.04.
      - name: Install the test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus libfuse2t64 jq

      - name: Install, launch and transcribe a clip
        timeout-minutes: 30
        run: |
          version="$(jq -r .version app/src-tauri/tauri.conf.json)"
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- \
            bash .github/scripts/smoke-linux.sh candidate app/src-tauri/tests/fixtures/jfk.wav "$version"

      - name: Collect app logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/scribe-logs"
          cp -R "$RUNNER_TEMP/scribe-smoke/." "$RUNNER_TEMP/scribe-logs/" 2>/dev/null || true
          cp -R "$HOME/.local/share/com.natkins.scribe/logs" "$RUNNER_TEMP/scribe-logs/app-logs" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/scribe-logs/squashfs-root" "$RUNNER_TEMP/scribe-logs/Applications"
          ls -la "$RUNNER_TEMP/scribe-logs"

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scribe-linux-logs
          path: ${{ runner.temp }}/scribe-logs
          if-no-files-found: ignore
          retention-days: 14
